<aside *ngIf="opened" class="backdrop" (click)="opened = false">
  <ul class="sidebar-list">
    <div>
    <li *ngFor="let option of options" (click)="handleClick(option)" [routerLink]="option.path">
      <span class="icon">{{ option.icon }}</span>
      {{ option.title }}
    </li>
    </div>
    <app-authentication-section/>
  </ul>
</aside>
