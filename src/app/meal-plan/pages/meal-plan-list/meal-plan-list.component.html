<section class="meal-plans-container">
  <h2 class="title">Planes de Comida</h2>

  <div class="filters-container">
    <div class="filter">
      <label for="calorieFilter">Filtrar por Calorías</label>
      <select id="calorieFilter" [(ngModel)]="selectedCalories" (change)="filterByCalories()">
        <option value="">Todos</option>
        <option *ngFor="let calorie of calories_per_day" [value]="calorie">{{ calorie }}</option>
      </select>
    </div>

    <div class="filter">
      <label for="goalFilter">Filtrar por Objetivo</label>
      <select id="goalFilter" [(ngModel)]="selectedGoal" (change)="filterByGoal()">
        <option value="">Todos</option>
        <option *ngFor="let goal of goals" [value]="goal">{{ goal }}</option>
      </select>
    </div>

    <div class="filter-buttons">
      <button (click)="resetFilters()">Mostrar Todos los Planes</button>
      <button class="create" (click)="goToCreateMealPlan()">Crear Nuevo Plan</button>
    </div>
  </div>

  <div class="meal-grid">
    <app-meal-item *ngFor="let plan of filteredMealPlans" [plan]="plan"></app-meal-item>
  </div>
</section>
