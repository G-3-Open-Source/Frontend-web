<h2 mat-dialog-title>Agregar Ingrediente</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Seleccionar Ingrediente</mat-label>
    <mat-select [(value)]="selectedIngredientId">
      <mat-option *ngFor="let ingredient of ingredients" [value]="ingredient.id">
        {{ ingredient.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="onAdd()" [disabled]="!selectedIngredientId">Agregar</button>
</mat-dialog-actions>
