<div class="container">
  <div class="sign-up-content">
    <div class="mat-card">
      <div class="mat-card-header">
        <div class="mat-card-title"> Sign In</div>
      </div>
      <div class="mat-card-content">
        <form [formGroup]="form" (submit)="onSubmit()">
          <div class="mat-form-field">
            <input type="text" placeholder="Username" id="username" name="username" required formControlName="username">
            <div class="mat-error" *ngIf="isInvalidControl(form,'username')">{{ errorMessagesForControl(form,'username')}}</div>
          </div>
          <div class="mat-form-field">
            <input type="password" placeholder="Password" id="password" name="password" formControlName="password">
            <div class="mat-error" *ngIf="isInvalidControl(form,'password')">{{ errorMessagesForControl(form,'password')}}</div>
          </div>
          <button type="submit" color="primary">Sign In</button>
          <p class="mat-body">
            Don't have an account?<a (click)="redirectToSignUp()"> Sign Up</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
