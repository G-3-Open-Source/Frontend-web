<!-- Ingredient catalogue -->
<div class="table-wrapper">
  <h3>{{ 'title.ingredients' | translate }}</h3>

  <!-- Add/Edit Form -->
  <app-ingredient-create-and-edit
    (editCanceled)="onCancelEdit()"
    (ingredientAdded)="onIngredientAdded($event)"
    (ingredientUpdated)="onIngredientUpdated($event)"
    [editMode]="isEditMode"
    [ingredient]="ingredientData" />

  <!-- Data Table -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8"
         matSort matSortActive="name" matSortDirection="asc">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
      <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
    </ng-container>

    <ng-container matColumnDef="calories">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Calorías </th>
      <td mat-cell *matCellDef="let element"> {{ element.calories }} </td>
    </ng-container>

    <ng-container matColumnDef="carbohydrates">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Carbohidratos </th>
      <td mat-cell *matCellDef="let element"> {{ element.carbohydrates }} </td>
    </ng-container>

    <ng-container matColumnDef="proteins">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Proteínas </th>
      <td mat-cell *matCellDef="let element"> {{ element.proteins }} </td>
    </ng-container>

    <ng-container matColumnDef="fats">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Grasas </th>
      <td mat-cell *matCellDef="let element"> {{ element.fats }} </td>
    </ng-container>

    <ng-container matColumnDef="macronutrientValuesId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID Macronutrientes </th>
      <td mat-cell *matCellDef="let element"> {{ element.macronutrientValuesId }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="onEditItem(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDeleteItem(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"
        [ngClass]="{'editable-row': ingredientData.id === row.id }">
    </tr>
  </table>

  <!-- Paginador -->
  <mat-paginator [pageSizeOptions]="[5, 10, 15]" [pageSize]="5" showFirstLastButtons></mat-paginator>
</div>
